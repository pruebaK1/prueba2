version: '3.8'

services:
  rtmp:
    image: tiangolo/nginx-rtmp
    container_name: rtmp-server
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./hls:/var/www/hls
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rtmp
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
